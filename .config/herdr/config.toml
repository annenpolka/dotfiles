# herdr configuration (macOS / Linux)
# Linked as ~/.config/herdr/config.toml by init.sh.
# Windows reads config.windows.toml instead (it pins the pane shell to pwsh).
# Full reference: `herdr --default-config`

onboarding = false

[terminal]
# Unset: new panes use $SHELL (zsh).
# default_shell = ""

[ui]
# herdr-auto-title が自動命名するため、タブ作成時の名前入力をスキップ
prompt_new_tab_name = false
# 外側ターミナルのタイトルに現在のタブ名を含める
window_title = "{workspace} · {tab}"

[experimental]
# prefixモード中はホストのIMEを英数入力に切り替え、抜けたら元に戻す
switch_ascii_input_source_in_prefix = true

[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"

[keys]
# tmux側のprefixはC-s（C-bはunbind済み）なので、tmux内でもC-bはherdrに届く
prefix = "ctrl+b"

# ペイン移動はctrl+h/j/k/lに任せ、prefix+h/j/k/lのデフォルト（focus_pane_*）は外す
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
# サイドバーのエージェント一覧を上下に移動
next_agent = "prefix+j"
previous_agent = "prefix+k"
# 横に並ぶタブバーを左右に移動（デフォルトのprefix+p/nも残す）
previous_tab = ["prefix+h", "prefix+p"]
next_tab = ["prefix+l", "prefix+n"]

# tmux nvim-integration.conf と同じC-h/j/k/l: nvimならキーを渡し、それ以外はペイン移動、端なら分割
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "$HOME/.config/herdr/scripts/nav left"
description = "focus/split pane left (pass to nvim)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "$HOME/.config/herdr/scripts/nav down"
description = "focus/split pane down (pass to nvim)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "$HOME/.config/herdr/scripts/nav up"
description = "focus/split pane up (pass to nvim)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "$HOME/.config/herdr/scripts/nav right"
description = "focus/split pane right (pass to nvim)"
