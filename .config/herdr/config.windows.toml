# herdr configuration (Windows)
# Symlinked as %APPDATA%\herdr\config.toml:
#   New-Item -ItemType SymbolicLink -Path "$env:APPDATA\herdr\config.toml" `
#     -Target "<dotfiles>\.config\herdr\config.windows.toml"
# Keep shared settings in sync with config.toml.

onboarding = false

# Use PowerShell 7 (pwsh) for pane shells so the PowerShell 7 profile loads
# (starship, zoxide, ghq+fzf, yazi, scoop completion, lazygit alias, ...).
# Without this, herdr falls back to Windows PowerShell 5.1 (powershell.exe).
[terminal]
default_shell = "pwsh.exe"

# tmux nvim-integration.conf と同じC-h/j/k/l: nvimならキーを渡し、それ以外はペイン移動、端なら分割
# Windows ではカスタムコマンドが cmd.exe /d /c で実行されるため、Git Bash 経由で POSIX 版 nav を呼ぶ。
# パスはこの dotfiles リポジトリの配置場所（リポジトリを移動したら要更新）。
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = 'C:\Users\lance\ghq\github.com\annenpolka\dotfiles\.config\herdr\scripts\nav.cmd left'
description = "focus/split pane left (pass to nvim)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = 'C:\Users\lance\ghq\github.com\annenpolka\dotfiles\.config\herdr\scripts\nav.cmd down'
description = "focus/split pane down (pass to nvim)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = 'C:\Users\lance\ghq\github.com\annenpolka\dotfiles\.config\herdr\scripts\nav.cmd up'
description = "focus/split pane up (pass to nvim)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = 'C:\Users\lance\ghq\github.com\annenpolka\dotfiles\.config\herdr\scripts\nav.cmd right'
description = "focus/split pane right (pass to nvim)"
